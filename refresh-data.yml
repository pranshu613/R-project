name: Refresh data

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Download prices
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: Rscript R/download_real_data.R

      - name: Calculate
        run: Rscript R/analysis.R

      - name: Commit new data
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data web/data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
